<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- CSP -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>TrustTab · 결제한 손님만 쓰는 공정한 리뷰</title>
    <meta
      name="description"
      content="TrustTab 은 결제 기록이 블록체인에 있는 손님만 리뷰를 쓰고, AI 가 광고 · 과장 리뷰를 걸러 내며, 단골에게 넘길 수 없는 포인트를 주는 동네 가게 리뷰 서비스입니다. (Sepolia 테스트넷 실습용)"
    />
    <meta name="application-name" content="TrustTab" />
    <link rel="canonical" href="%SITE_URL%" />

    <!-- 11단계 디자인(다크 글래스): 어두운 화면에 맞춘 브라우저 색 · 아이콘 · 앱 설치 정보 -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0e1c" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="TrustTab" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- 링크를 메신저 · SNS 에 붙였을 때 보이는 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="TrustTab" />
    <meta property="og:title" content="TrustTab · 결제한 손님만 쓰는 공정한 리뷰" />
    <meta property="og:description" content="결제 인증 · AI 판정 · 블록체인 기록으로 가짜 리뷰를 막는 동네 가게 리뷰 서비스" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrustTab — 결제한 손님만 쓰는 공정한 리뷰" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>TrustTab 은 JavaScript 가 켜져 있어야 동작합니다. 브라우저 설정에서 JavaScript 를 켜 주세요.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
